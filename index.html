<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efefef">
<title>ColorNotes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
<style>
:root {
  --bar: #efefef; --line: #d6d6d6; --ink: #1d1d1d; --muted: #8a8a8a;
  --accent: #009688; --sun: #c0392b; --sat: #1f6f9c; --today: #7b9cf5;
  --popup: #eeeeee; --dim: rgba(0,0,0,.38);
  --font: "Roboto", system-ui, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #fff; color: var(--ink); font: 400 20px/1.3 var(--font); overflow: hidden;
  display: flex; flex-direction: column; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Two pages side by side; native horizontal swipe with snap */
#pager { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
#pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; min-height: 0; }
.head { height: 68px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px; background: var(--bar); border-bottom: 1px solid var(--line); }
.head h1 { margin: 0; font-size: 34px; font-weight: 300; letter-spacing: .5px; color: #444; }
.iconbtn { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; }
.subbar { flex: none; margin: 6px 6px 0; height: 52px; background: #f6f6f6; border: 1px solid #e3e3e3; display: flex; align-items: center; justify-content: center; font-size: 22px; }

/* Notes list */
#noteList { flex: 1; overflow-y: auto; padding: 6px 6px 110px; display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; justify-content: space-between; min-height: 80px; padding: 0 22px; border-left: 8px solid; text-align: left; width: 100%; font-size: 28px; }
.item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.item .when { font-size: 20px; color: #666; flex: none; margin-left: 12px; }
.empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 22px; }

/* Calendar */
.monthbar { justify-content: space-between; padding: 0; }
.monthbar button { height: 100%; padding: 0 34px; font-size: 22px; }
.weekdays { flex: none; display: grid; grid-template-columns: repeat(7,1fr); padding: 10px 6px 6px; font-size: 18px; }
.weekdays div { padding-left: 8px; }
#grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7,1fr); grid-template-rows: repeat(6,1fr); margin: 0 6px 6px; border: 1px solid #e3e3e3; border-width: 1px 0 0 1px; }
.day { position: relative; border: 1px solid #e3e3e3; border-width: 0 1px 1px 0; display: flex; flex-direction: column; justify-content: space-between; padding: 4px 4px 6px 6px; text-align: left; min-width: 0; overflow: hidden; }
.day .num { font-size: 24px; }
.day.out { background: #eeeeee; color: #aaa; }
.day.today { outline: 3px solid var(--today); outline-offset: -3px; }
.day .sun { color: var(--sun); } .day .sat { color: var(--sat); }
.day.out .num { color: #aaa; }
.blocks { display: flex; flex-wrap: wrap; gap: 1px; justify-content: center; }
.blocks i { width: 13px; height: 13px; display: block; }

/* Bottom bar: two tabs */
#tabs { flex: none; height: 76px; display: flex; background: var(--bar); border-top: 1px solid var(--line); }
#tabs button { flex: 1; display: grid; place-items: center; color: #555; }
#tabs button[aria-selected="true"] { color: var(--accent); }

#fab { position: fixed; right: 20px; bottom: calc(96px + env(safe-area-inset-bottom,0px)); width: 72px; height: 72px; border-radius: 22px; background: var(--accent); color: #fff; font-size: 48px; font-weight: 300; line-height: 1; box-shadow: 0 4px 10px rgba(0,0,0,.3); z-index: 5; }

/* Popups */
.layer { position: fixed; inset: 0; z-index: 20; }
.scrim { background: var(--dim); display: grid; place-items: center; padding: 16px; }
.pop { width: 100%; max-width: 460px; background: var(--popup); border-radius: 34px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
.pop h2 { margin: 0; font-weight: 400; font-size: 26px; padding: 30px 30px 14px; }
.opt { display: flex; align-items: center; gap: 22px; width: 100%; padding: 22px 30px 30px; font-size: 26px; text-align: left; }
.dayhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; font-size: clamp(20px, 6vw, 26px); white-space: nowrap; }
.dayhead button { width: 64px; height: 64px; display: grid; place-items: center; }
#dayList { background: #e6e6e6; min-height: 90px; max-height: 50vh; overflow-y: auto; padding: 6px 6px 4px; display: flex; flex-direction: column; gap: 6px; }
#dayList .item { min-height: 72px; font-size: 26px; }
.popbtn { width: 100%; padding: 22px; font-size: 26px; font-weight: 500; color: var(--accent); }

/* Editor */
#editor { background: var(--pale); display: flex; flex-direction: column; }
.ebar { flex: none; height: 72px; display: flex; align-items: center; gap: 8px; padding: 0 6px; background: var(--mid); }
#eTitle { flex: 1; min-width: 0; height: 52px; font: 400 24px var(--font); padding: 0 12px; border: 1px solid rgba(0,0,0,.2); background: rgba(255,255,255,.9); color: var(--ink); }
#eColor { width: 52px; height: 52px; border-radius: 10px; background: var(--block); border: 1px solid rgba(0,0,0,.25); }
.einfo { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; font-size: 22px; color: #777; }
#eDate { display: flex; align-items: center; gap: 10px; border: 2px solid #444; border-radius: 4px; padding: 6px 12px; font-size: 22px; color: #555; }
#eBody { flex: 1; width: 100%; border: 0; resize: none; padding: 0 12px; font: 400 24px/48px var(--font); color: var(--ink); outline: none;
  background: repeating-linear-gradient(transparent 0 47px, var(--rule) 47px 48px); background-attachment: local; }
.menu { position: absolute; top: 70px; right: 8px; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.3); z-index: 2; }
.menu button { display: block; padding: 18px 28px; font-size: 22px; color: #c62828; }
#swatches { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; padding: 24px; }
#swatches button { aspect-ratio: 1.15; border-radius: 16px; border: 1px solid rgba(0,0,0,.15); }
#swatches button[aria-pressed="true"] { outline: 6px solid #cfcfcf; }
#datePick { position: fixed; opacity: 0; pointer-events: none; bottom: 0; left: 50%; width: 1px; height: 1px; }
</style>
</head>
<body>

<div id="pager">
  <section class="page" id="pgNotes" aria-label="Notes">
    <header class="head"><h1>ColorNote</h1></header>
    <div class="subbar">Sort by modified time</div>
    <div id="noteList"></div>
  </section>

  <section class="page" id="pgCal" aria-label="Calendar">
    <header class="head"><h1>Calendar</h1>
      <button class="iconbtn" id="todayBtn" aria-label="Go to today">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#333"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/></svg>
      </button>
    </header>
    <div class="subbar monthbar">
      <button id="prevM" aria-label="Previous month">▲</button>
      <span id="monthLabel"></span>
      <button id="nextM" aria-label="Next month">▼</button>
    </div>
    <div class="weekdays"><div style="color:var(--sun)">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div style="color:var(--sat)">SAT</div></div>
    <div id="grid"></div>
  </section>
</div>

<nav id="tabs" role="tablist">
  <button role="tab" id="tabNotes" aria-label="Notes" aria-selected="false">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor"><path d="M17 3V1.5h-1.5V3h-2V1.5H12V3h-2V1.5H8.5V3h-2V1.5H5V3a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM7 8h10v1.5H7zm0 3.5h10V13H7zM7 15h10v1.5H7z"/></svg>
  </button>
  <button role="tab" id="tabCal" aria-label="Calendar" aria-selected="false">
    <svg width="44" height="44" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/><text x="12" y="17.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="Roboto,sans-serif">31</text></svg>
  </button>
</nav>

<button id="fab" aria-label="Add">+</button>
<input type="date" id="datePick" tabindex="-1" aria-hidden="true">

<!-- Add note popup (same for notes and calendar) -->
<div class="layer scrim" id="addPop" hidden>
  <div class="pop">
    <h2 id="addTitle">Add</h2>
    <button class="opt" id="addText">
      <svg width="40" height="40" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3" fill="#333"/><path d="M6 7h12M6 12h12M6 17h12" stroke="#fff" stroke-width="2"/></svg>
      Text
    </button>
  </div>
</div>

<!-- Day popup -->
<div class="layer scrim" id="dayPop" hidden>
  <div class="pop">
    <div class="dayhead">
      <button id="dayPrev" aria-label="Previous day"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#333" stroke-width="2.5"/></svg></button>
      <span id="dayLabel"></span>
      <button id="dayNext" aria-label="Next day"><svg width="30" height="30" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="#333" stroke-width="2.5"/></svg></button>
    </div>
    <div id="dayList"></div>
    <button class="popbtn" id="dayAdd">Add</button>
  </div>
</div>

<!-- Editor (same screen for notes and calendar events) -->
<div class="layer" id="editor" hidden>
  <div class="ebar">
    <button class="iconbtn" id="eDone" aria-label="Save"><svg width="38" height="38" viewBox="0 0 24 24"><path d="m4 12.5 5 5L20 6.5" fill="none" stroke="#222" stroke-width="2.2"/></svg></button>
    <input id="eTitle" aria-label="Title" autocomplete="off">
    <button id="eColor" aria-label="Change colour"></button>
    <button class="iconbtn" id="eMore" aria-label="More"><svg width="30" height="30" viewBox="0 0 24 24" fill="#222"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button>
  </div>
  <div class="menu" id="eMenu" hidden><button id="eDelete">Delete</button></div>
  <div class="einfo"><span>Editing</span>
    <button id="eDate"><svg width="26" height="26" viewBox="0 0 24 24" fill="#555"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11zM7 11h10v2H7zm0 4h7v2H7z"/></svg><span id="eDateTxt"></span></button>
  </div>
  <textarea id="eBody" aria-label="Note"></textarea>
</div>

<!-- Colour picker -->
<div class="layer scrim" id="colorPop" hidden>
  <div class="pop" id="swatches"></div>
</div>

<script>
// [name, block colour, pale background, top-bar colour]
const COLORS = [
  ['red','#e44446','#fde3e6','#f29a9b'], ['orange','#ffa000','#ffe9d6','#ffc56b'], ['yellow','#ffdf00','#fdf6b9','#f5d96b'],
  ['green','#72c13a','#e3f6d9','#a9dc86'], ['blue','#0072ce','#e5e8fa','#8fb4e8'], ['purple','#7b36bc','#efe3f7','#b996dd'],
  ['black','#000000','#d6d6d6','#8c8c8c'], ['gray','#8a8a8a','#ececec','#bcbcbc'], ['white','#ffffff','#ffffff','#e2e2e2']
];
const C = Object.fromEntries(COLORS.map(c => [c[0], c]));
const TZ = 'America/Vancouver';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => { const t = new Date(Date.UTC(y, m, d)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
const parts = s => s.split('-').map(Number);
const addDays = (s, n) => { const [y, m, d] = parts(s); return ymd(y, m - 1, d + n); };
const todayStr = () => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const longDate = s => { const [y, m, d] = parts(s); return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', timeZone: 'UTC' }); };
const gridDays = (y, m) => { const start = 1 - new Date(Date.UTC(y, m, 1)).getUTCDay(); return Array.from({ length: 42 }, (_, i) => ymd(y, m, start + i)); };
console.assert(gridDays(2026, 10)[0] === '2026-11-01' && gridDays(2026, 10)[41] === '2026-12-12', 'month grid');
console.assert(addDays('2026-12-31', 1) === '2027-01-01', 'addDays');

// Storage: notes page and calendar are kept completely separate
const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } };
const store = { notes: load('cn_notes'), events: load('cn_events') };
const save = kind => { try { localStorage.setItem(kind === 'notes' ? 'cn_notes' : 'cn_events', JSON.stringify(store[kind])); } catch {} };

let today = todayStr();
let [viewY, viewM] = parts(today); viewM -= 1;
let dayShown = today;

// ---------- Rendering ----------
function itemEl(n, when) {
  const c = C[n.color] || C.yellow, b = document.createElement('button');
  b.className = 'item';
  b.style.background = c[2]; b.style.borderLeftColor = n.color === 'white' ? '#ccc' : c[1];
  b.innerHTML = '<span></span>' + (when ? '<span class="when"></span>' : '');
  b.firstChild.textContent = n.title || n.body.split('\n')[0];
  if (when) b.lastChild.textContent = when;
  return b;
}
function renderNotes() {
  const list = $('noteList'); list.replaceChildren();
  const notes = [...store.notes].sort((a, b) => b.mod - a.mod);
  if (!notes.length) list.innerHTML = '<div class="empty">No notes yet.<br>Tap + to add one.</div>';
  for (const n of notes) {
    const el = itemEl(n, new Date(n.mod).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: TZ }));
    el.onclick = () => openEditor('notes', n);
    list.append(el);
  }
}
function renderCal() {
  $('monthLabel').textContent = new Date(Date.UTC(viewY, viewM, 1)).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  const grid = $('grid'); grid.replaceChildren();
  gridDays(viewY, viewM).forEach((s, i) => {
    const [, m, d] = parts(s), b = document.createElement('button');
    b.className = 'day' + (m - 1 !== viewM ? ' out' : '') + (s === today ? ' today' : '');
    b.setAttribute('aria-label', longDate(s));
    const num = document.createElement('span');
    num.className = 'num' + (i % 7 === 0 ? ' sun' : i % 7 === 6 ? ' sat' : '');
    num.textContent = d;
    const blocks = document.createElement('div'); blocks.className = 'blocks';
    for (const e of eventsOn(s)) {
      const sq = document.createElement('i'); sq.style.background = C[e.color][1];
      if (e.color === 'white') sq.style.outline = '1px solid #bbb';
      blocks.append(sq);
    }
    b.append(num, blocks);
    b.onclick = () => openDay(s);
    grid.append(b);
  });
}
const eventsOn = s => store.events.filter(e => e.date === s).sort((a, b) => a.created - b.created);
function renderDay() {
  $('dayLabel').textContent = longDate(dayShown);
  const list = $('dayList'); list.replaceChildren();
  for (const e of eventsOn(dayShown)) { const el = itemEl(e); el.onclick = () => openEditor('events', e); list.append(el); }
}
const renderAll = () => { renderNotes(); renderCal(); if (!$('dayPop').hidden) renderDay(); };

// ---------- Layers + Android back button ----------
const stack = [];
function openLayer(id, onClose) { $(id).hidden = false; stack.push({ id, onClose }); history.pushState({ d: stack.length }, ''); }
function swapLayer(id, onClose) { const t = stack.pop(); $(t.id).hidden = true; $(id).hidden = false; stack.push({ id, onClose }); }
const closeTop = () => history.back();
addEventListener('popstate', () => { const t = stack.pop(); if (!t) return; $(t.id).hidden = true; t.onClose && t.onClose(); });
document.querySelectorAll('.scrim').forEach(s => s.addEventListener('click', e => { if (e.target === s) closeTop(); }));

// ---------- Add flow ----------
let addFor = null; // null = notes page, otherwise a date for the calendar
function showAdd(date, swap) {
  addFor = date;
  $('addTitle').textContent = date ? `Add note [${longDate(date)}]` : 'Add';
  swap ? swapLayer('addPop') : openLayer('addPop');
}
$('addText').onclick = () => openEditor(addFor ? 'events' : 'notes', null, addFor, true);

$('fab').onclick = () => {
  if (activeTab() === 'notes') return showAdd(null);
  const p = $('datePick'); p.value = today;
  try { p.showPicker(); } catch { showAdd(today); }
};
$('datePick').onchange = e => { if (e.target.value) showAdd(e.target.value); };

// ---------- Day popup ----------
function openDay(s) { dayShown = s; renderDay(); openLayer('dayPop'); }
$('dayPrev').onclick = () => { dayShown = addDays(dayShown, -1); renderDay(); };
$('dayNext').onclick = () => { dayShown = addDays(dayShown, 1); renderDay(); };
$('dayAdd').onclick = () => showAdd(dayShown, true);

// ---------- Editor ----------
let ed = null;
function paintEditor() {
  const c = C[ed.color], s = $('editor').style;
  s.setProperty('--pale', c[2]); s.setProperty('--mid', c[3]); s.setProperty('--block', c[1]);
  s.setProperty('--rule', ed.color === 'white' ? '#e3e3e3' : c[3]);
}
function openEditor(kind, note, date, swap) {
  ed = { kind, note, color: note ? note.color : 'yellow', date: note ? note.date : date, deleted: false };
  $('eTitle').value = note ? note.title : '';
  $('eBody').value = note ? note.body : '';
  $('eDate').hidden = kind !== 'events';
  $('eDateTxt').textContent = ed.date || '';
  $('eMenu').hidden = true;
  paintEditor();
  (swap ? swapLayer : openLayer)('editor', closeEditor);
  setTimeout(() => (note ? $('eBody') : $('eTitle')).focus(), 50);
}
function closeEditor() {
  const { kind, note } = ed, list = store[kind];
  const title = $('eTitle').value.trim(), body = $('eBody').value;
  if (ed.deleted || (!title && !body.trim())) {
    if (note) list.splice(list.indexOf(note), 1);
  } else if (note) {
    if (note.title !== title || note.body !== body || note.color !== ed.color || note.date !== ed.date) Object.assign(note, { title, body, color: ed.color, date: ed.date, mod: Date.now() });
  } else {
    list.push({ id: crypto.randomUUID?.() || String(Date.now()), title, body, color: ed.color, date: ed.date, created: Date.now(), mod: Date.now() });
  }
  save(kind); renderAll(); document.activeElement.blur();
}
$('eDone').onclick = closeTop;
$('eMore').onclick = () => { $('eMenu').hidden = !$('eMenu').hidden; };
$('eDelete').onclick = () => { if (confirm('Delete this note?')) { ed.deleted = true; closeTop(); } else $('eMenu').hidden = true; };
$('eDate').onclick = () => {
  const p = $('datePick'), prev = p.onchange;
  p.value = ed.date;
  p.onchange = e => { if (e.target.value) { ed.date = e.target.value; $('eDateTxt').textContent = ed.date; } p.onchange = prev; };
  try { p.showPicker(); } catch { p.onchange = prev; }
};
for (const [name, block] of COLORS) {
  const b = document.createElement('button');
  b.style.background = block; b.dataset.c = name; b.setAttribute('aria-label', name);
  b.onclick = () => { ed.color = name; paintEditor(); closeTop(); };
  $('swatches').append(b);
}
$('eColor').onclick = () => {
  for (const b of $('swatches').children) b.setAttribute('aria-pressed', b.dataset.c === ed.color);
  openLayer('colorPop');
};

// ---------- Swipe between pages ----------
const pager = $('pager');
const activeTab = () => (pager.scrollLeft > pager.clientWidth / 2 ? 'cal' : 'notes');
function markTab() {
  const t = activeTab();
  $('tabNotes').setAttribute('aria-selected', t === 'notes');
  $('tabCal').setAttribute('aria-selected', t === 'cal');
  try { localStorage.setItem('cn_tab', t); } catch {}
}
pager.addEventListener('scroll', markTab, { passive: true });
$('tabNotes').onclick = () => pager.scrollTo({ left: 0, behavior: 'smooth' });
$('tabCal').onclick = () => pager.scrollTo({ left: pager.clientWidth, behavior: 'smooth' });
addEventListener('resize', () => { pager.scrollLeft = activeTab() === 'cal' ? pager.clientWidth : 0; });

// ---------- Month navigation ----------
const shiftMonth = n => { const t = new Date(Date.UTC(viewY, viewM + n, 1)); viewY = t.getUTCFullYear(); viewM = t.getUTCMonth(); renderCal(); };
$('prevM').onclick = () => shiftMonth(-1);
$('nextM').onclick = () => shiftMonth(1);
$('todayBtn').onclick = () => { [viewY, viewM] = parts(today); viewM -= 1; renderCal(); };

// Keep "today" correct in Vancouver time (also after midnight while the page stays open)
setInterval(() => { const t = todayStr(); if (t !== today) { today = t; renderCal(); } }, 60000);

renderAll();
let startTab = 'notes'; try { startTab = localStorage.getItem('cn_tab') || 'notes'; } catch {}
requestAnimationFrame(() => { if (startTab === 'cal') pager.scrollLeft = pager.clientWidth; markTab(); });

// Offline support + "Add to Home screen" app install
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
